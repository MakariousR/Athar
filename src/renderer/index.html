<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Chat Memory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- SETUP OVERLAY -->
  <div id="setupOverlay" class="setup-overlay">
    <div class="setup-card">
      <h1>Chat Memory</h1>
      <p class="setup-sub">Your personal AI that remembers your past conversations.</p>
      <p id="setupStatus" class="setup-msg">Checking your local AI engine…</p>
      <div id="setupSteps" class="setup-steps"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appShell" class="app-shell hidden">

    <aside class="sidebar">
      <div class="sidebar-top">
        <span class="app-brand">Chat Memory</span>
        <button id="newChatBtn" class="icon-btn" title="New chat">＋</button>
      </div>

      <ul id="sessionList" class="session-list"></ul>

      <div class="sidebar-bottom">
        <div id="importZone" class="import-zone">
          <span id="importLabel">＋ Import chat history</span>
          <input type="file" id="fileInput" accept="application/json" class="hidden" />
        </div>
        <p id="importStatus" class="import-status hidden"></p>
      </div>
    </aside>

    <main class="chat-area">
      <div id="emptyState" class="empty-state">
        <p class="empty-title">Chat Memory</p>
        <p class="empty-sub">Start a new chat or select one from the sidebar.<br/>Import your ChatGPT or Claude history to give the AI context about your past work.</p>
        <button id="emptyNewChatBtn" class="primary-btn">New chat</button>
      </div>

      <div id="chatView" class="chat-view hidden">
        <div id="messageList" class="message-list"></div>
        <div class="input-bar">
          <textarea id="messageInput" placeholder="Message…" rows="1"></textarea>
          <button id="sendBtn" class="send-btn">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script src="marked.umd.js"></script>
  <script src="chat.js"></script>
</body>
</html>
